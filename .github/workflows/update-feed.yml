name: Update current affairs
on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST every day
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python scripts/fetch_feed.py
      - name: Commit if changed
        run: |
          git config user.name "nda-feed-bot"
          git config user.email "nda-feed-bot@users.noreply.github.com"
          git add data/current_affairs.json
          git diff --cached --quiet || (git commit -m "Update current affairs feed" && git push)
