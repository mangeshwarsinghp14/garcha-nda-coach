"use strict";

 Maths:{Algebra:["Complex numbers","Quadratic equations","Sequences and series","Permutations and combinations","Binomial theorem","Sets and relations"],
  Matrices:["Matrices and operations","Determinants and adjoint","Inverse and linear equations"],

 GAT:{English:["Grammar","Vocabulary","Comprehension","Sentence ordering"],Physics:["Mechanics","Electricity","Optics","Heat and sound","Units"],
  Chemistry:["Periodic table","Acids, bases, salts","Everyday chemistry"],Biology:["Human body","Nutrition and diseases","Plants and cells"],
  History:["Freedom movement","Medieval India","World history"],Polity:["Constitution","Parliament","Rights and duties"],

/* ============ maths generators (answers computed by brute force loops) ============ */
const fmt=n=>Number.isInteger(n)?String(n):String(+n.toFixed(3));
function mk(correct,wrongs,fm){fm=fm||fmt;const set=[correct];for(const w of wrongs){if(!set.some(x=>x===w))set.push(w)}
 let k=1;while(set.length<4){const c=correct+(k%2?k:-k)*(Math.abs(correct)>20?Math.ceil(Math.abs(correct)/10):1);k++;if(!set.some(x=>x===c))set.push(c)}
 const opts=shuffle(set.slice(0,4));return{o:opts.map(fm),a:opts.indexOf(correct)}}
const sgn=(n,first)=>first?(n<0?"-":"")+(Math.abs(n)===1?"":Math.abs(n)):(n<0?" - ":" + ")+Math.abs(n);
const poly=(a,b,c)=>{let s=(a===1?"":a)+"x²";if(b)s+=sgn(b)+"x";if(c)s+=sgn(c);return s};
const TRI=[[3,4,5],[5,12,13],[8,15,17],[6,8,10],[7,24,25],[20,21,29]];
const GEN={
Algebra:[
 ()=>{const a=rnd(1,9),d=rnd(2,6),n=rnd(10,25);let s=0;for(let k=0;k<n;k++)s+=a+k*d;
  return{t:"Sequences and series",q:`Sum of the first ${n} terms of the AP ${a}, ${a+d}, ${a+2*d}, ... is`,...mk(s,[s+d,s-n,n*(2*a+n*d)/2]),e:`S = n/2 [2a + (n-1)d] = ${n}/2 [${2*a} + ${(n-1)*d}] = ${s}`}},
 ()=>{const a=rnd(1,4),r=rnd(2,3),n=rnd(4,7);let t=a;for(let k=1;k<n;k++)t*=r;
  return{t:"Sequences and series",q:`The ${n}th term of the GP ${a}, ${a*r}, ${a*r*r}, ... is`,...mk(t,[t*r,t/r,a*r*n]),e:`T = a r^(n-1) = ${a} x ${r}^${n-1} = ${t}`}},
 ()=>{const p=rnd(1,6),q=rnd(-6,-1),a=rnd(1,3);const ans=p*p+q*q;
  return{t:"Quadratic equations",q:`If the roots of ${poly(a,-a*(p+q),a*p*q)} = 0 are α and β, then α² + β² =`,...mk(ans,[(p+q)**2,ans+2*Math.abs(p*q),(p+q)**2+2*p*q+1]),e:`Roots are ${p} and ${q}; sum of squares = ${ans}. Shortcut: (sum)² - 2(product)`}},
 ()=>{const n=rnd(4,8);let f=1;for(let k=2;k<n;k++)f*=k;let g=f*(n-1)*n/(n-1);

 ()=>{const n=rnd(6,12),r=rnd(2,4);const C=[];for(let i=0;i<=n;i++){C[i]=[1];for(let j=1;j<=i;j++)C[i][j]=(C[i-1][j-1]||0)+(C[i-1][j]||0)}
  const v=C[n][r];return{t:"Permutations and combinations",q:`Value of ${n}C${r} is`,...mk(v,[C[n][r+1],C[n+1]?C[n+1][r]:v+n,v+n]),e:`${n}C${r} = ${v}`}},
 ()=>{const n=rnd(6,15);let c=0;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(!((j-i)===1||(j-i)===n-1))c++;

 ()=>{const n=rnd(5,10);let s=0;for(let k=0;k<=n;k+=2){let c=1;for(let i=1;i<=k;i++)c=c*(n-i+1)/i;s+=c}
  return{t:"Binomial theorem",q:`${n}C0 + ${n}C2 + ${n}C4 + ... (all even-indexed) equals`,...mk(s,[2**n,s*2+1,s-1]),e:`Even-index sum = 2^(n-1) = 2^${n-1} = ${s}`}}],
Matrices:[
 ()=>{const D=rnd(2,5);return{t:"Determinants and adjoint",q:`For a 3x3 matrix A with |A| = ${D}, the value of |adj A| is`,...mk(D*D,[D*D*D,2*D,D]),e:`|adj A| = |A|^(n-1) = ${D}^2 = ${D*D}`}},
 ()=>{const D=rnd(2,4),k=rnd(2,3);return{t:"Determinants and adjoint",q:`For a 3x3 matrix A with |A| = ${D}, the value of |${k}A| is`,...mk(k**3*D,[k*D,k*k*D,k**3*D+k]),e:`|kA| = k^n |A| = ${k}^3 x ${D} = ${k**3*D}`}},
 ()=>{const a=rnd(2,7),b=rnd(1,6),c=rnd(1,6),d=rnd(2,7);const v=a*d-b*c;return{t:"Matrices and operations",q:`Determinant of the matrix [[${a}, ${b}], [${c}, ${d}]] is`,...mk(v,[a*d+b*c,a*c-b*d,v+b]),e:`ad - bc = ${a*d} - ${b*c} = ${v}`}}],

 ()=>{const [a,b]=pick([[1,1],[3,4],[5,12],[8,15],[6,8]]),m=rnd(1,3);const h=Math.hypot(a*m,b*m);

 ()=>{const [p,b,h]=pick(TRI),w=pick([["sin A",p,h,"tan A",p,b],["cos A",b,h,"tan A",p,b],["sin A",p,h,"cos A",b,h]]);
  const f=(x,y)=>{const g=gcd(x,y);return x/g+"/"+y/g};const ans=f(w[4],w[5]);

 ()=>{const k=rnd(2,20);return{t:"Heights and distances",q:`The angle of elevation of the top of a tower from a point ${k}√3 m from its foot is 30°. Height of the tower (m) is`,...mk(k,[k*3,k*2,k*Math.sqrt(3)].map(x=>Math.round(x*1000)/1000)),e:`h = d tan30° = ${k}√3 x 1/√3 = ${k}`}}],

 ()=>{const [A,B,h]=pick(TRI.slice(0,3).map(t=>[t[0],t[1],t[2]])),x1=rnd(-5,5),y1=rnd(-5,5),k=rnd(1,6);const C=h*k-(A*x1+B*y1);
  return{t:"Straight lines",q:`Distance of the point (${x1}, ${y1}) from the line ${A}x + ${B}y ${C<0?"-":"+"} ${Math.abs(C)} = 0 is`,...mk(k,[k+1,k*h,k+2]),e:`|${A}(${x1}) + ${B}(${y1}) + (${C})| / ${h} = ${h*k}/${h} = ${k}`}},
 ()=>{const x1=rnd(-4,4),y1=rnd(-4,4),dx=rnd(1,4),m=rnd(-4,4)||2;const x2=x1+dx,y2=y1+m*dx;

 ()=>{const a=rnd(1,6),b=rnd(1,6),c=rnd(-5,5);const s=`(${a}, ${b})`;const w=[`(${-a}, ${b})`,`(${b}, ${a})`,`(${a}, ${-b})`];const set=[s];w.forEach(x=>{if(!set.includes(x))set.push(x)});let k=1;while(set.length<4)set.push(`(${a+k}, ${b+k++})`);const o=shuffle(set.slice(0,4));

 ()=>{const a=rnd(1,4),b=rnd(1,5),c=rnd(1,6),x0=rnd(1,4);const v=3*a*x0*x0+2*b*x0+c;

 ()=>{const a=rnd(1,5),b=rnd(1,5),k=rnd(1,5);const v=a*k*k+b*k;
  return{t:"Definite integrals and area",q:`Value of the integral of (${2*a}x + ${b}) dx from 0 to ${k} is`,...mk(v,[v+k,a*k*k,2*a*k+b]),e:`[${a}x² + ${b}x] from 0 to ${k} = ${v}`}},
 ()=>{const a=rnd(1,8);return{t:"Limits and continuity",q:`Limit as x tends to ${a} of (x² - ${a*a})/(x - ${a}) is`,...mk(2*a,[a,a*a,0]),e:`(x-${a})(x+${a})/(x-${a}) = x+${a} -> ${2*a}`}}],

 ()=>{const u=[rnd(-4,5),rnd(-4,5),rnd(-4,5)],v=[rnd(-4,5),rnd(-4,5),rnd(-4,5)];let d=0;for(let i=0;i<3;i++)d+=u[i]*v[i];

 ()=>{const [a,b,c]=pick([[1,2,2],[2,3,6],[2,6,9],[4,4,7],[1,4,8]]),k=rnd(1,3);

 ()=>{const v=rnd(2,12),k=rnd(2,4),c=rnd(1,9);return{t:"Mean, median, variance",q:`If the variance of x is ${v}, the variance of ${k}x + ${c} is`,...mk(k*k*v,[k*v,k*k*v+c,k*v+c]),e:`Var(kx+c) = k² Var(x) = ${k*k*v}`}},
 ()=>{const s=rnd(3,11);const fav=[];for(let i=1;i<=6;i++)for(let j=1;j<=6;j++)if(i+j===s)fav.push(1);const n=fav.length,g=gcd(n,36);const ans=n/g+"/"+36/g;

 ()=>{const a=[rnd(2,20),rnd(2,20),rnd(2,20),rnd(2,20)];let s=a.reduce((x,y)=>x+y,0);const last=5*rnd(Math.ceil(s/5)+1,Math.ceil(s/5)+6)-s;a.push(last);s+=last;const m=s/5;

function topicStatus(k){const o=S.stats[k];if(!o||!o.a)return["Not started",0];const a=o.c/o.a;if(o.a>=15&&a>=.8)return["Mastered",a];if(o.a>=6&&a>=.6)return["Practised",a];return["Learning",a]}
P.home=()=>{
 const t=today(),l=S.log.find(x=>x.d===t)||{a:0,c:0};let streak=0;{let d=l.a?t:addDays(t,-1);while(S.log.find(x=>x.d===d&&x.a>0)){streak++;d=addDays(d,-1)}}
 const due=Object.entries(S.qs).filter(([id,c])=>c.due<=t).length;
 const last=S.tests.slice(-8);
 let h=`<div class="grid"><div class="card"><h3>Today</h3><b style="font-size:24px">${l.a}</b> questions<br><span class="mut">${l.a?Math.round(100*l.c/l.a):0}% correct · streak ${streak} day${streak===1?"":"s"}</span></div>
 <div class="card"><h3>Daily recall</h3>${S.recallDone===t?`<span class="ok">Done today</span>`:`<span class="warn">Not done yet</span>`}<br>Cards due: <b>${due}</b><br><button class="p" onclick="go('recall')">Start recall</button></div>
 <div class="card"><h3>Tests taken</h3><b style="font-size:24px">${S.tests.length}</b><br><button onclick="go('tests')">Open tests</button></div></div>`;
 h+=`<div class="card"><h3>Score trend (last tests, % of maximum)</h3>`+(last.length?last.map(x=>`<div class="row"><span style="width:150px" class="mut">${esc(x.name).slice(0,22)}</span><div class="bar" style="flex:1"><i style="width:${Math.max(0,Math.round(100*x.score/x.max))}%"></i></div><b>${Math.round(100*x.score/x.max)}%</b></div>`).join(""):`<span class="mut">No tests yet. Take a weekly test to start the trend.</span>`)+`</div>`;
 const weak=Object.entries(S.stats).filter(([k,o])=>o.a>=5).map(([k,o])=>[k,o.c/o.a,o.a]).sort((a,b)=>a[1]-b[1]).slice(0,5);
 h+=`<div class="card"><h3>Weakest topics (at least 5 attempts)</h3>`+(weak.length?weak.map(([k,a,n])=>`<div>${esc(k.replace("|"," - "))}: <b class="${a<.6?"bad":""}">${Math.round(100*a)}%</b> <span class="mut">(${n} attempts)</span></div>`).join(""):`<span class="mut">Appears after you practise.</span>`)+`</div>`;
 h+=`<div class="card"><h3>Latest current affairs</h3>`+(FEED.items.length?FEED.items.slice(0,3).map(i=>`<p style="margin:6px 0"><span class="tag">${esc(i.c)}</span>${esc(i.h)}</p>`).join("")+`<button onclick="go('ca')">See all</button>`:`<span class="mut">Connect to the internet once to load the latest feed.</span>`)+`<p class="mut" style="margin-top:8px">Always confirm dates and vacancies in the official UPSC notice: <a href="https://upsc.gov.in" target="_blank" rel="noopener">upsc.gov.in</a></p></div>`;
 h+=`<div class="card"><h3>Weekly plan</h3><table><tr><td>Mon-Fri</td><td>Daily recall (10-15 min) + 1 topic practice</td></tr><tr><td>Saturday</td><td>Weekly test: Maths (30 Q) or GAT (40 Q)</td></tr><tr><td>Sunday</td><td>Review mistakes + shortcuts drill</td></tr><tr><td>Last Sunday of month</td><td>Full Maths mock (120 Q, 2.5 h) and full GAT mock</td></tr></table></div>`;
 return h};
P.syllabus=()=>{let h=`<div class="card"><h2>Syllabus and progress</h2><p class="mut">Tick topics once studied. Status comes from your practice accuracy.</p></div>`;
 for(const paper in SYL){h+=`<div class="card"><h3>${paper==="Maths"?"Mathematics (300 marks)":"GAT (600 marks)"}</h3>`;
  for(const u in SYL[paper]){const tk=SYL[paper][u];const a=acc(paper==="Maths"?"Maths|"+u:u+"|"+"x");
   let ok=tk.filter(t=>S.covered[u+"|"+t]).length;h+=`<details><summary><b>${u}</b> ${paper==="Maths"&&UW[u]?`<span class="tag">~${UW[u]}% of marks</span>`:""}${paper==="GAT"&&GKW[u]?`<span class="tag">${GKW[u]}% of GK</span>`:""} <span class="mut">${ok}/${tk.length} studied</span></summary>`;
   tk.forEach(t=>{const k=(paper==="Maths"?"Maths":u)+"|"+t;const st=topicStatus(k);h+=`<div class="row" style="margin:4px 0"><label><input type="checkbox" data-cv="${esc(u+"|"+t)}" ${S.covered[u+"|"+t]?"checked":""}> ${esc(t)}</label><span class="tag">${st[0]}</span>${st[1]?`<span class="mut">${Math.round(st[1]*100)}%</span>`:""}</div>`});
   h+=`</details>`}h+=`</div>`}return h};
P.syllabus.after=()=>document.querySelectorAll("[data-cv]").forEach(c=>c.onchange=()=>{S.covered[c.dataset.cv]=c.checked;save()});
P.shortcuts=()=>{let h=`<div class="card"><h2>Shortcuts and theorems</h2><p class="mut">Each shortcut is run live against a brute-force calculation. A green tick means the shortcut and the long method agree on that problem. Learn the rule, then drill it.</p><div class="row"><button class="p" id="vall">Verify all now</button><select id="fsub"><option>All</option><option>Trigonometry</option><option>Algebra</option><option>Matrices</option><option>Calculus</option><option>Geometry</option><option>Statistics</option><option>Physics</option></select></div></div><div id="shl"></div>`;return h};
P.shortcuts.after=()=>{const f=$("fsub");const draw=()=>{$("shl").innerHTML=SH.map((s,i)=>({s,i})).filter(x=>f.value==="All"||x.s.sub===f.value).map(({s,i})=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${i+1}. ${esc(s.n)}</b><span class="tag">${s.sub}</span></div><p><code>${esc(s.rule)}</code></p><p>Problem: ${esc(s.p)}<br><span class="mut">Time: ${s.time}. ${esc(s.use)}</span></p><div class="row"><button data-v="${i}">Verify</button><span id="vr${i}"></span></div></div>`).join("");document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>verify(+b.dataset.v))};
 f.onchange=draw;draw();$("vall").onclick=()=>{f.value="All";draw();SH.forEach((_,i)=>verify(i))}};
function verify(i){const s=SH[i],a=s.f(),b=s.b();const tol=s.tol||1e-9;const ok=Math.abs(a-b)<=tol*Math.max(1,Math.abs(b));const el=$("vr"+i);if(el)el.innerHTML=`<span class="${ok?"ok":"bad"}">${ok?"✓ matches":"✗ mismatch"}</span> shortcut = ${+a.toFixed(6)} · brute force = ${+b.toFixed(6)}`;return ok}
P.practice=()=>{const mt=Object.keys(GEN),gs=[...new Set(allStatic().map(q=>q.s))];
 return `<div class="card"><h2>Practice</h2><p class="mut">Instant feedback after each answer. Maths questions are generated fresh each time.</p>
 <div class="row"><select id="ps">${mt.map(u=>`<option value="M:${u}">Maths - ${u}</option>`).join("")}<option value="M:">Maths - mixed</option>${gs.map(s=>`<option value="G:${s}">${s}</option>`).join("")}</select>
 <select id="pn"><option>10</option><option>20</option><option>30</option></select><button class="p" id="pgo">Start</button></div></div>
 <div class="card"><h3>Shortcut drill</h3><p class="mut">Timed practice on question types where a shortcut applies. Aim for under 60 seconds each.</p><button id="dr">Start 10-question drill</button></div>`};
P.practice.after=()=>{$("pgo").onclick=()=>{const [t,u]=$("ps").value.split(":"),n=+$("pn").value;let qs;if(t==="M")qs=Array.from({length:n},()=>genMaths(u||null));else{qs=shuffle(allStatic().filter(q=>q.s===u)).slice(0,n);if(!qs.length)return alert("No questions yet")}startRun(qs,{kind:"practice",name:"Practice"})};
 $("dr").onclick=()=>{const u=["Trigonometry","Algebra","Matrices","Statistics","Geometry"];const qs=[];for(let i=0;i<10;i++)qs.push(genMaths(pick(["Trigonometry","Algebra","Matrices","Stats","Geometry"])));startRun(qs,{kind:"practice",name:"Shortcut drill"})}};
P.recall=()=>{const t=today();const st=allStatic();const due=st.filter(q=>S.qs[q.id]&&S.qs[q.id].due<=t);const fresh=st.filter(q=>!S.qs[q.id]);
 return `<div class="card"><h2>Daily recall</h2><p>Ten questions: cards due for review first, then new ones. Wrong answers return tomorrow; right answers come back after 1, 2, 4, 8, 16, 32 days.</p>
 <p>Due now: <b>${due.length}</b> · New available: <b>${fresh.length}</b></p><button class="p" id="rgo">Start today's recall</button></div>
 <div class="card"><h3>What did I remember today?</h3><textarea id="note" placeholder="Write 3 things you learned today, from memory, without looking."></textarea><button id="nsv">Save note</button><div id="notes">${(S.notes||[]).slice(-5).reverse().map(n=>`<p><span class="mut">${n.d}</span><br>${esc(n.t)}</p>`).join("")}</div></div>`};
P.recall.after=()=>{$("rgo").onclick=()=>{const t=today();const st=allStatic();let qs=st.filter(q=>S.qs[q.id]&&S.qs[q.id].due<=t);qs=shuffle(qs).slice(0,10);if(qs.length<10)qs=qs.concat(shuffle(st.filter(q=>!S.qs[q.id])).slice(0,10-qs.length));
  while(qs.length<10)qs.push(genMaths());startRun(qs.map(q=>Object.assign({},q)),{kind:"recall",name:"Daily recall"})};
 $("nsv").onclick=()=>{const v=$("note").value.trim();if(!v)return;(S.notes=S.notes||[]).push({d:today(),t:v});save();go("recall")}};
function buildMaths(n){return Array.from({length:n},()=>genMaths())}
function buildGAT(total){const st=allStatic();const eng=shuffle(st.filter(q=>q.s==="English"));const gk=st.filter(q=>q.s!=="English"&&q.s!=="Maths");
 const needEng=Math.round(total/3),needGK=total-needEng;const out=eng.slice(0,needEng);const short=[];if(eng.length<needEng)short.push(`English ${eng.length} of ${needEng}`);
 const gkq=[];let have=0;for(const g in GKW){const need=Math.round(needGK*GKW[g]/100);const pool=shuffle(gk.filter(q=>gkGroup(q)===g));gkq.push(...pool.slice(0,need));have+=Math.min(pool.length,need);if(pool.length<need)short.push(`${g} ${pool.length} of ${need}`)}
 return{qs:out.concat(gkq),short}}
P.tests=()=>{const hist=S.tests.slice(-10).reverse();return `<div class="card"><h2>Tests</h2><p class="mut">Marking follows the real exam: Maths 2.5 marks, GAT 4 marks, one third deducted per wrong answer. A skipped question scores zero. Timer auto-submits.</p>
 <div class="grid">
 <div class="card"><h3>Weekly Maths</h3>30 questions · 45 min<br><button class="p" data-t="wm">Start</button></div>
 <div class="card"><h3>Weekly GAT</h3>40 questions · 45 min<br><button class="p" data-t="wg">Start</button></div>
 <div class="card"><h3>Monthly Maths mock</h3>120 questions · 150 min · 300 marks<br><button class="p" data-t="mm">Start</button></div>
 <div class="card"><h3>Monthly GAT mock</h3>150 questions · 150 min · 600 marks<br><button class="p" data-t="mg">Start</button></div></div></div>
 <div class="card"><h3>History</h3>${hist.length?`<table><tr><th>Date</th><th>Test</th><th>Score</th><th>R/W/S</th></tr>`+hist.map(x=>`<tr><td>${x.d}</td><td>${esc(x.name)}</td><td>${x.score}/${x.max}</td><td>${x.cor}/${x.wr}/${x.un}</td></tr>`).join("")+`</table>`:`<span class="mut">None yet.</span>`}</div>`};
P.tests.after=()=>document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=b.dataset.t;
 if(t==="wm")startRun(buildMaths(30),{kind:"test",name:"Weekly Maths",mins:45,pm:2.5,cut:1});
 else if(t==="mm")startRun(buildMaths(120),{kind:"test",name:"Monthly Maths mock",mins:150,pm:2.5,cut:1});
 else{const full=t==="mg",tot=full?150:40;const g=buildGAT(tot);if(!g.qs.length)return alert("No GAT questions in the bank");
  if(g.short.length&&!confirm(`The bank has only ${g.qs.length} of ${tot} GAT questions. Short: ${g.short.join(", ")}.\n\nThis will be a partial paper. Ask Claude to add more questions, then take the full paper.\n\nContinue with ${g.qs.length} questions?`))return;
  startRun(shuffle(g.qs),{kind:"test",name:full?"Monthly GAT mock":"Weekly GAT",mins:full?Math.round(150*g.qs.length/150):Math.round(45*g.qs.length/tot),pm:4,cut:1})}});
P.ca=()=>{const cats=["All",...new Set(FEED.items.map(i=>i.c))];
 return `<div class="card"><h2>Current affairs</h2><p class="mut">Pulled automatically from news feeds ${FEED.updated?"· last update "+esc(FEED.updated):"· no data loaded yet"}. These are headlines, not verified facts: open the source before you rely on one.</p>
 <div class="row"><select id="cc">${cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select><input id="cs" placeholder="Search" style="flex:1;min-width:120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px"><button class="p" id="cfl">10 flashcards</button></div></div><div id="cl"></div>`};
P.ca.after=()=>{const draw=()=>{const c=$("cc").value,q=$("cs").value.trim().toLowerCase();const it=FEED.items.filter(i=>(c==="All"||i.c===c)&&(!q||i.h.toLowerCase().includes(q))).slice(0,80);
  $("cl").innerHTML=it.length?it.map(i=>`<div class="card"><span class="tag">${esc(i.c)}</span><span class="mut">${esc(i.d)} · ${esc(i.s||"")}</span><p style="margin:8px 0">${esc(i.h)}</p>${/^https?:/.test(i.u||"")?`<a href="${esc(i.u)}" target="_blank" rel="noopener">Open source</a>`:""}</div>`).join(""):`<div class="card mut">Nothing to show. Open the app online to load the feed.</div>`};
 $("cc").onchange=draw;$("cs").oninput=draw;draw();
 $("cfl").onclick=()=>{const t=today();const id=i=>"ca:"+hsh(i.u||i.h);const due=FEED.items.filter(i=>S.qs[id(i)]&&S.qs[id(i)].due<=t);const fresh=FEED.items.filter(i=>!S.qs[id(i)]);
  const set=shuffle(due).slice(0,10);const need=10-set.length;set.push(...fresh.slice(0,need));if(!set.length)return alert("No current-affairs items loaded yet");runFlash(set)}};
let FL=null;
function runFlash(items){FL={items,i:0,knew:0};drawFlash()}
function drawFlash(){if(FL.i>=FL.items.length){$("app").innerHTML=`<div class="card"><h2>Flashcards done</h2><p>You knew ${FL.knew} of ${FL.items.length}. Cards you missed return tomorrow; known ones come back after longer gaps.</p><button class="p" onclick="go('ca')">Back</button></div>`;return}
 const it=FL.items[FL.i];$("app").innerHTML=`<div class="card"><span class="tag">${esc(it.c)}</span><span class="mut">Card ${FL.i+1} / ${FL.items.length} · ${esc(it.d)}</span><p style="font-size:17px;margin:14px 0">${esc(it.h)}</p>${/^https?:/.test(it.u||"")?`<a href="${esc(it.u)}" target="_blank" rel="noopener">Open source</a>`:""}
 <div class="row" style="margin-top:12px"><button class="p" id="fk">I knew this</button><button id="fn">Learn again</button></div></div>`;
 const done=ok=>{const id="ca:"+hsh(it.u||it.h);srRecord(id,ok);stat("CurrentAffairs",it.c,ok);if(ok)FL.knew++;FL.i++;save();drawFlash()};
 $("fk").onclick=()=>done(true);$("fn").onclick=()=>done(false)}
P.current=()=>`<div class="card"><h2>Current affairs and bank</h2><p class="mut">Optional: add your own questions or notes as JSON. The shared question bank and current affairs update on their own from the internet.</p>
 <h3>Add questions</h3><textarea id="jq" placeholder='[{"s":"CurrentAffairs","u":"Defence","q":"...","o":["A","B","C","D"],"a":1,"e":"source and note"}]'></textarea><button id="aq" class="p">Add to bank</button> <span id="aqm"></span>
 <h3>Bank size</h3><div>${Object.entries(allStatic().reduce((m,q)=>(m[q.s]=(m[q.s]||0)+1,m),{})).map(([k,v])=>`<span class="tag">${k} ${v}</span>`).join("")}</div>
 <h3>Latest items</h3>${(S.ca||[]).slice(-10).reverse().map(c=>`<p><span class="mut">${esc(c.d)}</span> ${esc(c.h)}</p>`).join("")||`<span class="mut">None yet.</span>`}
 <textarea id="jc" placeholder='[{"d":"2026-11-12","h":"One-line fact with source"}]'></textarea><button id="ac">Add items</button>
 <h3>Passcode lock (convenience only, not real security)</h3><div class="row"><input id="pcode" type="password" placeholder="New passcode"><button id="pset">Set</button><button id="pclr">Remove</button></div>
 <h3>Backup</h3><div class="row"><button id="ex">Export data</button><button id="im">Import data</button></div><textarea id="bk" placeholder="Export text appears here. Paste a backup here and press Import."></textarea></div>`;
P.current.after=()=>{$("aq").onclick=()=>{try{const a=JSON.parse($("jq").value);if(!Array.isArray(a))throw 0;const okq=a.filter(x=>x&&x.s&&x.q&&Array.isArray(x.o)&&x.o.length===4&&Number.isInteger(x.a)&&x.a>=0&&x.a<4);S.custom=S.custom.concat(okq);save();$("aqm").textContent=`Added ${okq.length} of ${a.length}`}catch(e){$("aqm").textContent="Invalid JSON"}};
 $("ac").onclick=()=>{try{const a=JSON.parse($("jc").value);S.ca=S.ca.concat(a.filter(x=>x.d&&x.h));save();go("current")}catch(e){alert("Invalid JSON")}};
 $("pset").onclick=async()=>{const v=$("pcode").value;if(v.length<4)return alert("Use at least 4 characters");S.lock=await sha(v);save();alert("Passcode set")};$("pclr").onclick=()=>{S.lock=null;save();alert("Passcode removed")};
 $("ex").onclick=()=>{$("bk").value=JSON.stringify(S)};$("im").onclick=()=>{try{S=Object.assign({stats:{},qs:{},tests:[],covered:{},log:[],custom:[],ca:[],lock:null},JSON.parse($("bk").value));save();go("home")}catch(e){alert("Invalid backup")}}};
const TABS=[["home","Home"],["syllabus","Syllabus"],["shortcuts","Shortcuts"],["practice","Practice"],["recall","Daily recall"],["tests","Tests"],["ca","Current affairs"],["current","Bank and backup"]];
function go(p){if(R&&R.timer)clearInterval(R.timer);R=null;$("nav").innerHTML=TABS.map(t=>`<button data-g="${t[0]}" class="${t[0]===p?"on":""}">${t[1]}</button>`).join("");
 document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{if(R&&!R.done&&!confirm("Leave this session? Progress in it will be lost."))return;go(b.dataset.g)});
 $("app").innerHTML=P[p]();if(P[p].after)P[p].after()}
/* ============ optional lock (convenience only; real privacy = private repo) ============ */
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
async function boot(){$("hd").textContent="NDA written exam prep";
 if(S.lock){$("nav").innerHTML="";$("app").innerHTML=`<div class="card"><h2>Locked</h2><input id="pw" type="password" placeholder="Passcode"> <button class="p" id="un">Unlock</button> <span id="er" class="bad"></span></div>`;
  $("un").onclick=async()=>{if(await sha($("pw").value)===S.lock)go("home");else $("er").textContent="Wrong passcode"}}
 else go("home")}
/* ============ PWA: install, share, service worker ============ */
let dip=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;$("inst").hidden=false});
window.addEventListener("appinstalled",()=>{$("inst").hidden=true});
$("inst").onclick=async()=>{if(!dip)return;dip.prompt();await dip.userChoice;dip=null;$("inst").hidden=true};
$("shr").onclick=async()=>{const u=location.href.split("#")[0];const t="Garcha NDA Coach: free NDA written exam prep app";
 try{if(navigator.share){await navigator.share({title:t,text:t,url:u})}else{await navigator.clipboard.writeText(u);alert("Link copied: "+u)}}catch(e){}};
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.navigator.standalone;
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
async function start(){await Promise.race([loadData(),new Promise(r=>setTimeout(r,6000))]);await boot();
 if(ios&&!S.iosHint){S.iosHint=1;save();alert("To install on iPhone: tap Share, then 'Add to Home Screen'.")}}
start();
</script></body></html>
